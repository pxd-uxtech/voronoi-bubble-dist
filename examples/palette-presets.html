<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoronoiBubble — Palette Presets</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .chart h2 { margin: 0 0 8px; font-size: 18px; }
    .chart svg { width: 100%; height: auto; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <section class="chart"><h2>colors: "waterLilies"</h2><div id="waterLilies"></div></section>
      <section class="chart"><h2>colors: "starryNight"</h2><div id="starryNight"></div></section>
      <section class="chart"><h2>colors: "wave"</h2><div id="wave"></div></section>
      <section class="chart"><h2>colors: "sunrise"</h2><div id="sunrise"></div></section>
    </div>
  </div>

  <script type="module">
    import { VoronoiBubble } from '../dist/voronoi-bubble.standalone.js';

    const data = [
      { group: 'Research', subgroup: 'Discovery', item: 'Interviews', size: 28 },
      { group: 'Research', subgroup: 'Synthesis', item: 'Coding', size: 22 },
      { group: 'Design', subgroup: 'Prototype', item: 'Flows', size: 24 },
      { group: 'Design', subgroup: 'Prototype', item: 'UI states', size: 16 },
      { group: 'Build', subgroup: 'Frontend', item: 'Components', size: 30 },
      { group: 'Build', subgroup: 'Backend', item: 'APIs', size: 20 },
      { group: 'Launch', subgroup: 'Growth', item: 'Docs', size: 18 },
      { group: 'Launch', subgroup: 'Support', item: 'Feedback', size: 14 },
    ];

    for (const palette of ['waterLilies', 'starryNight', 'wave', 'sunrise']) {
      const svg = new VoronoiBubble().render(data, {
        width: 700,
        height: 520,
        colors: palette,
        showGroupLabel: true,
        labelMode: 'faded',
        seedRandom: 'palette-presets',
      });
      document.getElementById(palette).appendChild(svg);
    }
  </script>
</body>
</html>
