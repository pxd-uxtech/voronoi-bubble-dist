<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoronoiBubble — Simple Popup</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    #chart svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap"><div id="chart"></div></div>

  <script type="module">
    import { VoronoiBubble, showVoronoiPopup } from '../dist/voronoi-bubble.standalone.js';

    const data = [
      { group: 'Positive', subgroup: 'Delivery', item: 'Fast delivery', size: 30, review: 'The order arrived the next day.' },
      { group: 'Positive', subgroup: 'Quality', item: 'Good material', size: 25, review: 'The finish feels clean and durable.' },
      { group: 'Neutral', subgroup: 'Price', item: 'Fair price', size: 18, review: 'I would buy again during a promotion.' },
      { group: 'Negative', subgroup: 'Price', item: 'Too expensive', size: 15, review: 'The price feels high compared with similar products.' },
      { group: 'Negative', subgroup: 'Support', item: 'Slow response', size: 8, review: 'It took too long to get a reply.' },
    ];

    const svg = new VoronoiBubble().render(data, {
      width: 1200,
      height: 900,
      title: 'Review Topic Map',
      showGroupLabel: true,
      showPercent: true,
      onClick: (cell) => showVoronoiPopup(cell, {
        format: '<b>{item}</b><br>{group} / {subgroup}<br>Count: {size}<br>{review}'
      })
    });

    document.getElementById('chart').appendChild(svg);
  </script>
</body>
</html>
