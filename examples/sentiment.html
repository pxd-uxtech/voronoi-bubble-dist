<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoronoiBubble — Sentiment</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    #chart svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="wrap"><div id="chart"></div></div>
  <script type="module">
    // Local development: run npm run build, then npm run dev.
    // CDN: https://cdn.jsdelivr.net/gh/pxd-uxtech/voronoi-bubble-dist@v2.1.3/dist/voronoi-bubble.standalone.js
    import { VoronoiBubble } from '../dist/voronoi-bubble.standalone.js';

    // score: 1-5 sentiment/rating field.
    const data = [
      { group: 'Positive', subgroup: 'Delivery', item: 'Fast delivery', size: 30, score: 5 },
      { group: 'Positive', subgroup: 'Quality', item: 'Good material', size: 25, score: 5 },
      { group: 'Positive', subgroup: 'Packaging', item: 'Careful packaging', size: 18, score: 4 },
      { group: 'Neutral', subgroup: 'Price', item: 'Fair price', size: 16, score: 3 },
      { group: 'Negative', subgroup: 'Price', item: 'Too expensive', size: 15, score: 2 },
      { group: 'Negative', subgroup: 'Support', item: 'Slow response', size: 8, score: 1 },
    ];

    const svg = new VoronoiBubble().render(data, {
      width: 1200, height: 900, title: 'Sentiment Colormap',
      sentiment: 'score',
      showGroupLabel: true,
    });
    document.getElementById('chart').appendChild(svg);
  </script>
</body>
</html>
